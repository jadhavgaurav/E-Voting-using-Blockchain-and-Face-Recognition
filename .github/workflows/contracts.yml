name: Contracts CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts.yml'

jobs:
  build-and-test:
    name: Build & Test Contracts
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Run tests
        run: npm run test

      - name: Check for compilation warnings
        run: |
          # Re-compile and check output for warnings
          OUTPUT=$(npm run compile 2>&1)
          if echo "$OUTPUT" | grep -i "warning"; then
            echo "Compilation warnings found!"
            echo "$OUTPUT"
            exit 1
          fi
          echo "No compilation warnings found."

  # Optional: Run on different Node versions for compatibility
  compatibility:
    name: Node.js ${{ matrix.node-version }} Compatibility
    runs-on: ubuntu-latest
    needs: build-and-test
    
    strategy:
      matrix:
        node-version: ['18', '20', '22']
    
    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test
