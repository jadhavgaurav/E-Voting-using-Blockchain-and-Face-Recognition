name: E-Voting System Contracts CI

on:
  push:
    branches: [main, develop]
    paths:
      - "evoting-system/contracts/**"
      - ".github/workflows/evoting-system-contracts.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "evoting-system/contracts/**"
      - ".github/workflows/evoting-system-contracts.yml"

jobs:
  build-and-test:
    name: Build & Test E-Voting Contracts
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: evoting-system/contracts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: evoting-system/contracts/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile contracts
        run: pnpm run compile

      - name: Run tests
        run: pnpm run test
